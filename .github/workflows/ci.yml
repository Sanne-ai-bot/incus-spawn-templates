# Checks every definition with the latest isx release, or the one ISX_CI_VERSION pins, then builds
# the templates a change reaches on a real Incus. A tool that isx does not know is skipped by
# `isx build` with a warning, and a key it does not know is ignored, so the build alone would pass
# either: the check fails on both.
#
# Only `pull_request`, never `pull_request_target`: this runs the PR's definitions and scripts, so
# it gets a read-only token and no secret.
#
# Maven Central throttles a runner's shared address, so the build's proxy fetches a cold artifact
# from Google's mirror of Central (`definitions.py configure --build`), and the proxy's artifact
# caches are kept between runs in the Actions cache. A pull request's run can restore only its own
# caches and the default branch's, so only runs on main save them, and a push to main builds what
# it reached, to fill them. A pull request's own copies would share the repository's cache quota
# and could evict main's, which every pull request restores.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      templates:
        description: "Templates to build, space-separated, or 'all' (every template here: slow)"
        required: true
        default: tpl-tamboui

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      templates: ${{ steps.reach.outputs.templates }}
      isx-version: ${{ steps.isx.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The latest release, unless the repository variable ISX_CI_VERSION names one.
      - name: Install isx
        id: isx
        env:
          GH_TOKEN: ${{ github.token }}
          ISX_CI_VERSION: ${{ vars.ISX_CI_VERSION }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y python3-yaml; }
          .github/scripts/install-isx.sh

      - name: Configure isx
        run: .github/scripts/definitions.py configure

      - name: Check the definitions
        run: .github/scripts/definitions.py check

      - name: Templates to build
        id: reach
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUESTED: ${{ inputs.templates }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            templates=$(.github/scripts/definitions.py pick "$REQUESTED")
          else
            # A push that created the branch, or a force push, names a base this clone lacks.
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE=HEAD~1
            fi
            templates=$(.github/scripts/definitions.py reach "$BASE")
          fi
          echo "Templates to build: $templates"
          echo "templates=$templates" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.template }})
    needs: check
    if: needs.check.outputs.templates != '[]'
    runs-on: ubuntu-24.04
    # tpl-openjdk and tpl-graalvm-dev clone and prime repositories of several GB.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.check.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      # As incus-spawn's isx-integration-tests-native job prepares its runner.
      - name: Install Incus
        run: |
          set -o pipefail
          curl -fsSL https://pkgs.zabbly.com/key.asc | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/zabbly.gpg >/dev/null
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.gpg] https://pkgs.zabbly.com/incus/stable $codename main" \
            | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.list
          sudo apt-get update -q
          sudo apt-get install -y -q incus btrfs-progs qemu-system-x86
          sudo usermod -aG incus-admin "$USER"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The release the check job resolved, so a release published in between cannot split them.
      - name: Install isx
        env:
          GH_TOKEN: ${{ github.token }}
          ISX_CI_VERSION: ${{ needs.check.outputs.isx-version }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y python3-yaml; }
          .github/scripts/install-isx.sh

      - name: Initialize isx
        run: |
          sg incus-admin -c "isx init </dev/null"
          # 'sudo incus admin init' leaves ~/.config/incus/ owned by root.
          sudo chown -R "$USER:$USER" ~/.config/incus/ 2>/dev/null || true
          # isx init adds the 'cow' btrfs pool without rewiring the default profile.
          sg incus-admin -c "incus profile device set default root pool=cow"

      # Without a GitHub account: the build clones public repositories anonymously (see configure).
      - name: Configure isx
        run: .github/scripts/definitions.py configure --build

      # The proxy's Maven, Gradle and npm caches from this template's newest run on main. Never
      # another template's, so each cache holds only what its own template fetches. The paths are
      # the save step's, word for word, since they make the cache's version and a restore finds
      # only a cache of the same version. Each artifact is stored with its checksum and confirmed
      # with its repository as the proxy's tiers say, as on any host. A '.' ends the template's
      # name in the key, so tpl-leyden never restores tpl-leyden-quarkus's.
      - name: Restore the proxy's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/incus-spawn/maven-verified
            ~/.cache/incus-spawn/gradle-verified
            ~/.cache/incus-spawn/npm
          key: proxy-cache-${{ matrix.template }}.${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            proxy-cache-${{ matrix.template }}.

      - name: List the restored caches
        run: .github/scripts/proxy-caches.sh > /tmp/proxy-caches.before

      - name: Start the proxy
        run: |
          gateway=$(sg incus-admin -c "incus network get incusbr0 ipv4.address" | cut -d/ -f1)
          sg incus-admin -c "isx proxy start" > /tmp/proxy.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "http://$gateway:18080/health" >/dev/null 2>&1; then
              echo "Proxy ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/proxy.out
          echo "::error::The proxy did not become healthy within 30s"
          exit 1

      # Below the job's limit, so a build that runs out of time still saves what it fetched.
      - name: Build ${{ matrix.template }}
        timeout-minutes: 160
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          if [[ $TEMPLATE == ci-tool-* ]]; then
            .github/scripts/definitions.py tool-template "$TEMPLATE"
          fi
          sg incus-admin -c "isx build --yes --verbose '$TEMPLATE'"

      - name: Disk use
        if: always()
        run: |
          df -h /
          sg incus-admin -c "incus storage info cow" || true

      - name: Proxy log
        if: failure()
        run: tail -n 200 ~/.local/state/incus-spawn/proxy.log || true

      # Only on main (see the header). A failed build's artifacts are as sound as a passing one's,
      # so they are kept too. The proxy stops first, so no download is still being written, and
      # what it left half done, a *.tmp file, is deleted: the save takes every file in the three
      # directories.
      - name: Stop the proxy
        id: proxy-stop
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          # Longer than the proxy's own forced exit (ProxyService.STOP_FORCE_EXIT_SECONDS in incus-spawn).
          pkill -x isx-proxy || true
          for i in $(seq 1 40); do
            pgrep -x isx-proxy >/dev/null || break
            sleep 0.5
          done
          if pgrep -x isx-proxy >/dev/null; then
            echo "The proxy is still running: its caches are not saved"
            exit 0
          fi
          (cd ~/.cache/incus-spawn &&
            find maven-verified gradle-verified npm -type f -name '*.tmp' -delete 2>/dev/null) || true
          if [ "$(.github/scripts/proxy-caches.sh)" = "$(cat /tmp/proxy-caches.before 2>/dev/null)" ]; then
            echo "The proxy's caches hold nothing new: not saved"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the proxy's caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.proxy-stop.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/incus-spawn/maven-verified
            ~/.cache/incus-spawn/gradle-verified
            ~/.cache/incus-spawn/npm
          key: proxy-cache-${{ matrix.template }}.${{ github.run_id }}-${{ github.run_attempt }}

  # One check of a fixed name to require, whatever the matrix held: it fails when the check did,
  # or any build did, and passes when nothing needed building.
  result:
    name: templates
    needs: [check, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Result
        env:
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "check: $CHECK, build: $BUILD"
          [ "$CHECK" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; }
