# yaml-language-server: $schema=https://isx.run/schema/template.json
name: tpl-isx-review
description: isx - review terminal that cannot push; needs a read-only GitHub token (isx account add github)
parent: tpl-isx-claude
# The read-only GitHub account this template uses. isx does not check a token's scope, so the
# name tells the user what to store here: see the README, "Reviewing with a read-only token".
accounts:
  github: readonly
agent_note: |
   This instance reaches GitHub with a read-only token: it cannot push, comment or review on GitHub. Report findings in your reply instead.
