name: openjdk-primer
description: Drop a CLAUDE.md primer in the home dir so Claude Code knows how this OpenJDK box is wired

# Images have no `files:` field, so the primer ships as a tool. It lands at
# ~/CLAUDE.md (parent of ~/jdk): Claude Code loads it for any work under the
# home dir, and keeping it out of the repo leaves `git status` on ~/jdk clean.
files:
  - path: /home/agentuser/CLAUDE.md
    owner: agentuser
    content: |
      # OpenJDK development box

      This is a disposable OpenJDK dev environment (incus-spawn `tpl-openjdk`,
      Fedora 45). The JDK **mainline** source is checked out at `~/jdk`
      (currently JDK 28). Everything below is already installed and verified.

      ## Boot JDK — important

      The build needs a boot JDK of 27/28. This box ships **JDK 27** as
      `java-latest-openjdk` and points `JAVA_HOME` at it:

          JAVA_HOME=/usr/lib/jvm/java-latest-openjdk   # JDK 27

      Do **not** boot-build with an older JDK. (There is no JDK 25 here — this
      template deliberately skips it so `configure` doesn't warn about the wrong
      boot JDK version.)

      ## Configure

      One-time, from `~/jdk`. This line wires in every tool this box provides:

          cd ~/jdk
          CC=/usr/bin/gcc CXX=/usr/bin/g++ bash configure \
            --with-boot-jdk=/usr/lib/jvm/java-latest-openjdk \
            --with-jtreg=/opt/jtreg \
            --with-gtest=/opt/gtest \
            --with-hsdis=capstone --enable-hsdis-bundling \
            --enable-ccache

      The `CC=`/`CXX=` prefix is **required** — see the ccache note below.

      - `--with-jtreg=/opt/jtreg` — the jtreg harness (regression/`test/**`).
        There is **no** env auto-detect; this flag is the only way in.
      - `--with-gtest=/opt/gtest` — GoogleTest 1.14.0 for the HotSpot C++ unit
        tests. Version must match `GTEST_VERSION`; configure checks it.
      - `--with-hsdis=capstone --enable-hsdis-bundling` — builds hsdis with the
        capstone backend and bundles `hsdis-<arch>.so` into the JDK image, so
        `-XX:+PrintAssembly` just works after a plain `make` (no separate hsdis
        build step needed). `binutils-devel` is also installed if you prefer
        `--with-hsdis=binutils`.
      - `--enable-ccache` — let OpenJDK's build wrap the compiler with ccache
        for fast incremental rebuilds. **Important:** the Fedora `ccache`
        package ships `/etc/profile.d/ccache.sh`, which prepends
        `/usr/lib64/ccache` to `PATH` in every login shell. The entries there
        (`gcc`, `g++`, …) are symlinks to `ccache`, so a bare `configure` picks
        one up and aborts with:

            configure: error: /usr/lib64/ccache/gcc is a symbolic link to
            ccache. This is not supported.

        OpenJDK does its own ccache wrapping and wants the *real* compiler.
        Passing `CC=/usr/bin/gcc CXX=/usr/bin/g++` (as above) points it at the
        unwrapped binaries; `--enable-ccache` then wraps them itself, and
        `configure` reports `ccache status: Active`. (Alternatively, drop
        `/usr/lib64/ccache` from `PATH` for the `configure`/`make` calls — but
        the `CC=`/`CXX=` prefix is the least surprising.)

      HotSpot work usually wants a debug build. Use a **separate** configuration
      so you can keep both (same `CC=`/`CXX=` prefix applies):

          CC=/usr/bin/gcc CXX=/usr/bin/g++ bash configure \
            --with-debug-level=fastdebug --with-conf-name=fastdebug \
            --with-boot-jdk=/usr/lib/jvm/java-latest-openjdk \
            --with-jtreg=/opt/jtreg --with-gtest=/opt/gtest \
            --with-hsdis=capstone --enable-hsdis-bundling --enable-ccache
          make CONF=fastdebug images

      ## Build

          make images            # full product build → build/*/images/jdk
          make hotspot           # just the JVM (faster iteration)
          make docs              # API docs (pandoc + graphviz are installed)
          make clean / dist-clean

      Run the freshly built JDK:

          build/*/images/jdk/bin/java --version

      ## Using the built JDK for HTTPS (Maven, Gradle)

      Before the built JDK downloads anything over HTTPS (for example as
      `JAVA_HOME` for a Maven or Gradle build), run, after `make images`:

          isx-trust ~/jdk/build

      Before the first `make images` there is nothing to link: the command
      prints nothing and changes nothing. When it links something it prints
      one line per JDK (`images/jdk`, the exploded `jdk`, and the
      `support/interim-image`).

      Run it again after a build that re-creates the image. A `make images`
      after a change to the Java sources (for example in `java.base`) deletes
      and re-creates `images/jdk`, which puts a regular `cacerts` back where
      the link was; a `make images` with nothing to rebuild keeps the link.
      Repeating the command is harmless.

      Why: the built JDK carries its own `lib/security/cacerts`, which does not
      hold the isx CA that this box's HTTPS proxy signs with. Downloads then
      fail with `certificate_unknown` or `PKIX path building failed`.
      `isx-trust` replaces that file with a link to the system store
      (`/etc/pki/ca-trust/extracted/java/cacerts`), which does hold the isx CA.
      Never turn certificate verification off instead.

      **The link changes the JDK under test.** `test/jdk/sun/security/lib/cacerts/VerifyCACerts.java`
      (run by `tier2`) checks the count and checksum of the image's `cacerts`,
      so on a linked image it fails with `wrong checksum` and a certificate
      count that is not the one it expects. That failure is the link, not your
      change. Before running that test, put the build's own file back (replace
      `<conf>` with your configuration, e.g. `linux-x86_64-server-release`):

          cd ~/jdk/build/<conf>
          cp --remove-destination support/modules_libs/java.base/security/cacerts \
            images/jdk/lib/security/cacerts

      and, if you test the exploded JDK (`build/<conf>/jdk`):

          ln -sfn ../../../support/modules_libs/java.base/security/cacerts \
            jdk/lib/security/cacerts

      Run `isx-trust ~/jdk/build` again afterwards to use the JDK for HTTPS.

      Opt-in, only for a build that never leaves this box: adding
      `--with-cacerts-file=/etc/pki/ca-trust/extracted/java/cacerts` to
      `configure` makes every rebuild trust the system store with no further
      step. It does so by **copying** that store into the JDK, so
      `VerifyCACerts` fails on that build as well. A JDK built that way and
      given to anyone else trusts this host's isx CA and any host CAs
      propagated into the box, and nothing in the image says so. The link
      does not copy a CA: on Fedora or RHEL it resolves to that machine's own
      store, and on a machine without that path it fails visibly. That is why
      the configure lines above do not carry the flag.

      ## Test

          make test TEST=tier1                       # standard first tier
          make test TEST="gtest:all"                 # all HotSpot C++ unit tests
          make test TEST="gtest:os"                  # one gtest suite
          make test TEST="jtreg:test/hotspot/jtreg/compiler/c2"   # a jtreg dir
          make test TEST="jtreg:test/jdk/java/lang"

      ## Disassembly (hsdis)

      Because hsdis is bundled at build time, PrintAssembly works out of the box:

          build/*/images/jdk/bin/java -XX:+UnlockDiagnosticVMOptions \
            -XX:+PrintAssembly -XX:CompileCommand=print,*::yourMethod ...

      ## Contribution workflow (Skara)

      The Skara CLI is on PATH as git subcommands:

          git jcheck          # pre-flight the commit against OpenJDK rules
          git webrev          # generate a webrev
          git pr              # create/manage a pull request
          git info / git defpath / git sync

      ## Notes

      - Do not push branches or open PRs/public comments unless explicitly asked.
      - jtreg here is Shipilev's build fetched unsigned (no integrity pin); it is
        pinned to the version the repo expects.
